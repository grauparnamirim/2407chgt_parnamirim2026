<!DOCTYPE html>
<!-- PÁGINA: Login — CHGT HelpDesk -->
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CHGT HelpDesk — Login</title>
  <link rel="stylesheet" href="./css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/iconify-icon@2/dist/iconify-icon.min.js"></script>
</head>

<body class="login-body">
  <!-- Botão de alternância de tema -->
  <button class="header-icon-btn login-theme-toggle" title="Selecionar tema" onclick="abrirModalTemas()"><iconify-icon
      icon="mdi:theme-light-dark" width="20" height="20"></iconify-icon></button>

  <!-- Lado esquerdo: logotipo e créditos -->
  <div class="login-left">
    <div class="login-left-content">
      <img src="/midia/logo_grau_rn.png" alt="Grau Técnico" class="login-logo-img">
      <p class="login-subtitle">Central de HelpDesk Grau T&eacute;cnico</p>
    </div>
    <div class="login-left-footer">Desenvolvido por Wesly e DG</div>
  </div>

  <!-- Lado direito: formulário de login -->
  <div class="login-right">
    <div class="login-form-wrapper">
      <div class="login-form-header">
        <h2>Acessar o Sistema</h2>
        <p>Fa&ccedil;a login com suas credenciais</p>
      </div>

      <!-- Formulário de login -->
      <form id="login-form">
        <!-- Seleção de unidade -->
        <div class="form-group mb-12">
          <label for="unidade">Unidade</label>
          <select id="unidade" required>
            <option value="">Selecione a unidade...</option>
          </select>
          <small class="text-secondary" id="unidade-hint" style="font-size:0.7rem;"></small>
        </div>

        <!-- Campo de email -->
        <div class="login-field">
          <span class="login-field-icon">&#9993;&#65039;</span>
          <input type="email" id="email" placeholder="Email corporativo" required autocomplete="email">
        </div>

        <!-- Campo de senha -->
        <div class="login-field pwd-wrapper">
          <span class="login-field-icon">&#128274;</span>
          <input type="password" id="senha" placeholder="Senha" required autocomplete="current-password">
          <button type="button" class="pwd-toggle" onclick="togglePassword('senha' ,this)" aria-label="Ver senha">
            <iconify-icon icon="mdi:eye-outline" width="19" height="19"></iconify-icon>
          </button>
        </div>

        <!-- Botão de envio -->
        <button type="submit" class="btn btn-primary btn-block btn-lg">
          Entrar no Sistema &nbsp;&rarr;
        </button>
      </form>

      <!-- Mensagem de erro do login -->
      <p class="login-error" id="login-msg"></p>
    </div>
  </div>

  <script src="app.js"></script>
  <script src="./js/index/script.js"></script>

</body>

</html>
