<!DOCTYPE html>
<!-- PÁGINA: Fornecedores — CHGT HelpDesk -->
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CHGT — Fornecedores</title>
  <link rel="stylesheet" href="./css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/iconify-icon@2/dist/iconify-icon.min.js"></script>
  <style>
  </style>
</head>

<body>
  <!-- Sidebar -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-brand"><img src="/midia/logo_grau_rn.png" alt="Grau Técnico"
        style="width:32px;height:32px;border-radius:6px;flex-shrink:0;">
      <div class="brand-text">
        <h2>CHGT HelpDesk</h2><span>GRAU TÉCNICO</span>
      </div>
    </div>
    <nav class="sidebar-nav" id="sidebar-nav"></nav>
    <div class="sidebar-footer">
      <div class="sidebar-avatar" id="sidebar-avatar">U</div>
      <div class="sidebar-user-info">
        <div class="user-name" id="sidebar-nome">Usuário</div>
        <div class="user-role" id="sidebar-cargo">perfil</div>
      </div>
      <button class="sidebar-logout" id="sidebar-logout" title="Sair"><iconify-icon icon="mdi:logout" width="18"
          height="18"></iconify-icon></button>
    </div>
  </aside>
  <!-- Botão de toggle da sidebar -->
  <button class="sidebar-toggle" id="sidebar-toggle">☰</button>
  <div class="main">
    <!-- Topo da página com breadcrumb e ações -->
    <div class="top-header">
      <div class="breadcrumb" id="breadcrumb">Gestão › <strong>Fornecedores</strong></div>
      <div class="header-actions">
        <button class="header-icon-btn" id="btn-tema" title="Selecionar tema" onclick="abrirModalTemas()"><iconify-icon
            icon="mdi:theme-light-dark" width="20" height="20"></iconify-icon></button>
        <button class="btn btn-sm btn-outline" onclick="carregarFornecedores()"><iconify-icon icon="mdi:refresh"
            width="16" height="16"></iconify-icon> Atualizar</button>
      </div>
    </div>

    <!-- Tabela de fornecedores -->
    <div class="tab-panel active" style="display:block">
      <div class="card">
        <div class="card-header">
          <h2><iconify-icon icon="mdi:truck-delivery" width="20" height="20"></iconify-icon> Fornecedores</h2>
          <button class="btn btn-primary btn-sm" id="btn-novo-fornecedor"
            onclick="abrirModalNovoFornecedor()"><iconify-icon icon="mdi:plus" width="24" height="24"></iconify-icon>
            Novo Fornecedor</button>
        </div>
        <div class="card-body no-padding">
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>Nome</th>
                  <th>CNPJ</th>
                  <th>WhatsApp</th>
                  <th>Email</th>
                  <th>Tipo de Serviço</th>
                  <th>Status</th>
                  <th>Ações</th>
                </tr>
              </thead>
              <tbody id="tabela-fornecedores">
                <tr>
                  <td colspan="7" class="text-center text-secondary">Carregando...</td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
  <script src="./js/fornecedores/script.js"></script>

</body>

</html>
