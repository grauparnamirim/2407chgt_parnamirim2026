<!DOCTYPE html>
<!-- PÁGINA: Meus Chamados — CHGT HelpDesk -->
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CHGT HelpDesk — Meus Chamados</title>
  <link rel="stylesheet" href="./css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/iconify-icon@2/dist/iconify-icon.min.js"></script>
</head>

<body>
  <!-- Sidebar -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-brand"><img src="/midia/logo_grau_rn.png" alt="Grau Técnico"
        style="width:32px;height:32px;border-radius:6px;flex-shrink:0;">
      <div class="brand-text">
        <h2>CHGT HelpDesk</h2><span>GRAU TÉCNICO</span>
      </div>
    </div>
    <nav class="sidebar-nav" id="sidebar-nav"></nav>
    <div class="sidebar-footer">
      <div class="sidebar-avatar" id="sidebar-avatar">U</div>
      <div class="sidebar-user-info">
        <div class="user-name" id="sidebar-nome">Usuário</div>
        <div class="user-role" id="sidebar-cargo">usuario</div>
      </div>
      <button class="sidebar-logout" id="sidebar-logout" title="Sair"><iconify-icon icon="mdi:logout" width="18"
          height="18"></iconify-icon></button>
    </div>
  </aside>
  <!-- Botão de toggle da sidebar -->
  <button class="sidebar-toggle" id="sidebar-toggle">☰</button>
  <div class="main">
    <!-- Topo da página -->
    <div class="top-header">
      <div class="breadcrumb" id="breadcrumb">Usuário › <strong>Meus Chamados</strong></div>
      <div class="header-actions"><button class="header-icon-btn" id="btn-tema-u" title="Selecionar tema"
          onclick="abrirModalTemas()"><iconify-icon icon="mdi:theme-light-dark" width="20"
            height="20"></iconify-icon></button><button class="btn btn-sm btn-outline"
          onclick="carregarTudo()"><iconify-icon icon="mdi:refresh" width="16" height="16"></iconify-icon>
          Atualizar</button></div>
    </div>
    <!-- Abas de navegação -->
    <div class="tabs">
      <button class="tab-btn active" data-tab="meus-chamados" onclick="ativarTab('meus-chamados')"><span
          style="display:inline-flex;align-items:center;gap:6px;"><iconify-icon icon="mdi:ticket-outline" width="20"
            height="20"></iconify-icon> Meus Chamados</span></button>
    </div>
    <!-- Painel de meus chamados -->
    <div class="tab-panel active" id="tab-meus-chamados">
      <!-- Grid de estatísticas -->
      <div class="stats-grid" id="stats-usuario">
        <div class="stat-card">
          <div class="stat-icon abertos"><iconify-icon icon="mdi:folder-open-outline" width="22"
              height="22"></iconify-icon></div>
          <div class="stat-data">
            <div class="stat-num" id="stat-u-abertos">0</div>
            <div class="stat-lbl">Abertos</div>
          </div>
        </div>
        <div class="stat-card">
          <div class="stat-icon andamento"><iconify-icon icon="mdi:progress-wrench" width="22"
              height="22"></iconify-icon></div>
          <div class="stat-data">
            <div class="stat-num" id="stat-u-andamento">0</div>
            <div class="stat-lbl">Em Andamento</div>
          </div>
        </div>
        <div class="stat-card">
          <div class="stat-icon abertos"><iconify-icon icon="mdi:truck-outline" width="22" height="22"></iconify-icon>
          </div>
          <div class="stat-data">
            <div class="stat-num" id="stat-u-aguardando">0</div>
            <div class="stat-lbl">Aguard. Fornecedor</div>
          </div>
        </div>
        <div class="stat-card">
          <div class="stat-icon resolvidos"><iconify-icon icon="mdi:check-circle-outline" width="22"
              height="22"></iconify-icon></div>
          <div class="stat-data">
            <div class="stat-num" id="stat-u-resolvidos">0</div>
            <div class="stat-lbl">Resolvidos</div>
          </div>
        </div>
      </div>
      <!-- Card da tabela de chamados -->
      <div class="card">
        <div class="card-header">
          <h2><iconify-icon icon="mdi:ticket-outline" width="20" height="20"></iconify-icon> Meus Chamados</h2><span
            class="text-secondary" style="font-size:0.8rem" id="total-meus-chamados"></span>
        </div>
        <div class="card-body no-padding"><!-- Barra de filtros -->
          <div class="filter-bar"><button class="filter-btn active"
              onclick="selecionarFiltro(this,'todos')">Todos</button><button class="filter-btn"
              onclick="selecionarFiltro(this,'Aberto')">Aberto</button><button class="filter-btn"
              onclick="selecionarFiltro(this,'Em andamento')">Em andamento</button><button class="filter-btn"
              onclick="selecionarFiltro(this,'Aguardando Fornecedor')">Aguard. Fornecedor</button><button
              class="filter-btn" onclick="selecionarFiltro(this,'Resolvido')">Resolvido</button></div>
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>#</th>
                  <th>Título / Descrição</th>
                  <th>Categoria</th>
                  <th>Local</th>
                  <th>Técnico</th>
                  <th>Status</th>
                  <th>Tempo aguardando</th>
                  <th>Ações</th>
                  <th>Histórico</th>
                  <th>Última Atualização</th>
                </tr>
              </thead>
              <tbody id="tabela-chamados">
                <tr>
                  <td colspan="10" class="text-center text-secondary">Carregando...</td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>
  <!-- Botão flutuante de novo chamado -->
  <button class="fab" onclick="abrirModalNovoChamado()" title="Abrir chamado"><iconify-icon icon="mdi:plus" width="24"
      height="24"></iconify-icon></button>
  <span class="fab-label">Novo Chamado</span>

  <script src="app.js"></script>
  <script src="./js/meus-chamados/script.js"></script>
</body>

</html>
