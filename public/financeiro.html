<!DOCTYPE html>
<!-- PÁGINA: Financeiro — CHGT HelpDesk -->
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CHGT — Financeiro</title>
  <link rel="stylesheet" href="./css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/iconify-icon@2/dist/iconify-icon.min.js"></script>
</head>

<body class="page-financeiro">
  <!-- Sidebar -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-brand"><img src="/midia/logo_grau_rn.png" alt="Grau Técnico"
        style="width:32px;height:32px;border-radius:6px;flex-shrink:0;">
      <div class="brand-text">
        <h2>CHGT HelpDesk</h2><span>GRAU TÉCNICO</span>
      </div>
    </div>
    <nav class="sidebar-nav" id="sidebar-nav"></nav>
    <div class="sidebar-footer">
      <div class="sidebar-avatar" id="sidebar-avatar">U</div>
      <div class="sidebar-user-info">
        <div class="user-name" id="sidebar-nome">Usuário</div>
        <div class="user-role" id="sidebar-cargo">perfil</div>
      </div>
      <button class="sidebar-logout" id="sidebar-logout" title="Sair"><iconify-icon icon="mdi:logout" width="18"
          height="18"></iconify-icon></button>
    </div>
  </aside>
  <!-- Botão de toggle da sidebar -->
  <button class="sidebar-toggle" id="sidebar-toggle">☰</button>
  <!-- Conteúdo principal -->
  <div class="main financeiro-main">
    <!-- Topo da página com breadcrumb e ações -->
    <div class="top-header">
      <div class="breadcrumb" id="breadcrumb">Financeiro › <strong>Orçamentos</strong></div>
      <div class="header-actions">
        <button class="header-icon-btn" id="btn-tema" title="Selecionar tema" onclick="abrirModalTemas()"><iconify-icon
            icon="mdi:theme-light-dark" width="20" height="20"></iconify-icon></button>
        <button class="btn btn-sm btn-outline" onclick="carregarOrcamentos()"><iconify-icon icon="mdi:refresh"
            width="16" height="16"></iconify-icon> Atualizar</button>
      </div>
    </div>

    <div class="tab-panel active financeiro-content" style="display:block">
      <div class="stats-grid financeiro-stats" id="metricas-financeiras">
        <div class="stat-card">
          <div class="stat-icon total"><iconify-icon icon="mdi:currency-usd" width="22" height="22"></iconify-icon>
          </div>
          <div class="stat-data">
            <div class="stat-num" id="met-orc-total">R$ 0,00</div>
            <div class="stat-lbl">Valor Total dos Orçamentos</div>
          </div>
        </div>
        <button class="stat-card financeiro-stat-pendente" type="button" onclick="filtrarOrcamentosPendentes()"
          title="Exibir somente orçamentos pendentes">
          <div class="stat-icon andamento"><iconify-icon icon="mdi:file-document-clock" width="22"
              height="22"></iconify-icon></div>
          <div class="stat-data">
            <div class="stat-num" id="met-orc-pendentes">0</div>
            <div class="stat-lbl">Orçamentos Pendentes</div><span class="financeiro-stat-link">Ver pendentes
              <iconify-icon icon="mdi:arrow-right" width="14" height="14"></iconify-icon></span>
          </div>
        </button>
      </div>

      <div id="aba-orcamentos">
        <div class="card">
          <div class="card-header financeiro-orcamentos-header">
            <div>
              <h2><iconify-icon icon="mdi:file-document" width="20" height="20"></iconify-icon> Orçamentos</h2>
              <p>Controle e aprovação das solicitações financeiras.</p>
            </div>
            <div class="financeiro-orcamentos-actions"><button class="btn btn-outline btn-sm" type="button"
                onclick="exportarOrcamentosPdf()"><iconify-icon icon="mdi:file-pdf-box" width="18"
                  height="18"></iconify-icon> Exportar PDF</button><button class="btn btn-primary btn-sm"
                onclick="abrirModalNovoOrcamento()" id="btn-novo-orcamento"><iconify-icon icon="mdi:plus" width="24"
                  height="24"></iconify-icon> Solicitar Orçamento</button></div>
          </div>
          <div class="card-body no-padding">
            <div class="financeiro-inline-filters financeiro-orcamento-filtros">
              <label class="financeiro-busca-orcamento"><iconify-icon icon="mdi:magnify" width="18"
                  height="18"></iconify-icon><input id="filtro-orc-busca" type="search"
                  placeholder="Buscar orçamento, chamado, avulso, descrição ou fornecedor"
                  aria-label="Buscar orçamentos por número, chamado, tipo, descrição ou fornecedor"
                  oninput="agendarBuscaOrcamentos()"></label>
              <select id="filtro-orc-status" onchange="carregarOrcamentos()"
                style="font-size:0.8rem;padding:4px 8px;border-radius:6px;border:1px solid var(--color-border);background:var(--color-bg);color:var(--color-text);flex:1;min-width:120px">
                <option value="">Todos Status</option>
                <option value="pendente">Pendente</option>
                <option value="aprovado">Aprovado</option>
                <option value="rejeitado">Rejeitado</option>
              </select>
              <select id="filtro-orc-mes" onchange="carregarOrcamentos()"
                style="font-size:0.8rem;padding:4px 8px;border-radius:6px;border:1px solid var(--color-border);background:var(--color-bg);color:var(--color-text);flex:1;min-width:120px">
                <option value="">Todos Mês</option>
                <option value="1">Janeiro</option>
                <option value="2">Fevereiro</option>
                <option value="3">Março</option>
                <option value="4">Abril</option>
                <option value="5">Maio</option>
                <option value="6">Junho</option>
                <option value="7">Julho</option>
                <option value="8">Agosto</option>
                <option value="9">Setembro</option>
                <option value="10">Outubro</option>
                <option value="11">Novembro</option>
                <option value="12">Dezembro</option>
              </select>
              <input type="number" id="filtro-orc-ano" value="2026" onchange="carregarOrcamentos()"
                style="font-size:0.8rem;padding:4px 8px;border-radius:6px;border:1px solid var(--color-border);background:var(--color-bg);color:var(--color-text);flex:1;min-width:100px"
                placeholder="Ano">
              <select id="filtro-orc-tipo" onchange="carregarOrcamentos()"
                style="font-size:0.8rem;padding:4px 8px;border-radius:6px;border:1px solid var(--color-border);background:var(--color-bg);color:var(--color-text);flex:1;min-width:120px">
                <option value="">Todos Tipos</option>
                <option value="avulso">Avulso</option>
                <option value="vinculado">Vinculado a Chamado</option>
              </select>
              <button class="btn btn-outline btn-sm financeiro-limpar-filtros" type="button"
                onclick="limparFiltrosOrcamentos()" title="Limpar filtros"><iconify-icon
                  icon="mdi:filter-remove-outline" width="17" height="17"></iconify-icon><span>Limpar</span></button>
            </div>
            <div class="table-wrap">
              <table>
                <thead>
                  <tr>
                    <th>#</th>
                    <th>Chamado</th>
                    <th>Descrição</th>
                    <th>Fornecedor</th>
                    <th>Valor Total</th>
                    <th>Status</th>
                    <th>Solicitante</th>
                    <th>Data</th>
                    <th>Ações</th>
                  </tr>
                </thead>
                <tbody id="tabela-orcamentos">
                  <tr>
                    <td colspan="9" class="text-center text-secondary">Carregando...</td>
                  </tr>
                </tbody>
                <tfoot id="footer-orcamentos" style="font-weight:700">
                  <tr>
                    <td colspan="4" style="text-align:right">Total:</td>
                    <td id="total-orcamentos">R$ 0,00</td>
                    <td colspan="4"></td>
                  </tr>
                </tfoot>
              </table>
            </div>
          </div>
        </div>
      </div>

    </div>
  </div>

  <script src="app.js"></script>
  <script src="./js/financeiro/script.js"></script>
</body>

</html>
